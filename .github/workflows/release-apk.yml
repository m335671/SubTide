name: Release signed APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Bump versionCode
        id: bump
        run: |
          set -euo pipefail
          GRADLE_FILE=app/build.gradle.kts
          CURRENT=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$GRADLE_FILE")
          NEXT=$((CURRENT + 1))
          VERSION_NAME="1.0.$NEXT"
          sed -i "s/versionCode = $CURRENT/versionCode = $NEXT/" "$GRADLE_FILE"
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" "$GRADLE_FILE"
          echo "version_code=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "ci: bump versionCode to ${{ steps.bump.outputs.version_code }} [skip ci]"
          git push

      - name: Decode signing keystore
        run: echo "${{ secrets.SUBTIDE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/subtide-release.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          SUBTIDE_STORE_FILE: ${{ runner.temp }}/subtide-release.jks
          SUBTIDE_STORE_PASSWORD: ${{ secrets.SUBTIDE_KEYSTORE_PASSWORD }}
          SUBTIDE_KEY_ALIAS: ${{ secrets.SUBTIDE_KEY_ALIAS }}
          SUBTIDE_KEY_PASSWORD: ${{ secrets.SUBTIDE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK artifact
        run: cp app/build/outputs/apk/release/app-release.apk "subtide-${{ steps.bump.outputs.version_name }}.apk"

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "SubTide v${{ steps.bump.outputs.version_name }}"
          make_latest: true
          files: subtide-${{ steps.bump.outputs.version_name }}.apk
